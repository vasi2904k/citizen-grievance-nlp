name: CI - Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r api/requirements.txt

    - name: Verify model artifact contract
      run: |
        python scripts/verify_model_artifacts.py
        if python scripts/verify_model_artifacts.py --root "$RUNNER_TEMP/empty-model-root" --strict; then
          echo "Expected strict verification to fail when artifacts are absent"
          exit 1
        fi

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 api/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        cd api
        python -m pytest test_api.py -v --cov=. --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./api/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t citizen-grievance-api:latest .

    - name: Run container tests
      run: docker run --rm citizen-grievance-api:latest pytest test_api.py